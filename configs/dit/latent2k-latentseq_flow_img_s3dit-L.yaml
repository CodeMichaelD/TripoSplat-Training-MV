models:
  denoiser:
    name: LatentSeqMMFlowModel
    args:
      q_token_length: 2048
      in_channels: 16
      cam_channels: 5
      out_channels: 16
      model_channels: 1024
      cond_channels: 1280
      cond2_channels: 128
      num_refiner_blocks: 2
      num_blocks: 24
      num_heads: 16
      mlp_ratio: 4
      pe_mode: 3d_ot_repo
      qk_rms_norm: true
      share_mod: true
      use_shift_table: true
      use_fp16: true
dataset:
  name: SmartImageConditionedGSOctreeLatent
  args:
    cond_jitter_prob: 0.05
    predict_cam_token: true
    latent_token_length: 2048
    latent_model: latentseq_xl_step0400000
    min_aesthetic_score: 4.5
    image_size: 1024 # load with full res, rescaled in trainer mixin
    decoder_path: null  # path to stage3 VAE checkpoint directory
    decoder_ckpt: step0400000
    max_voxel_level: 8
    max_sampled_points: 8192
    decode_mode: gs
    ot_mode: 3d_ot
train_val_dataset:
  name: SmartImageConditionedGSOctreeLatent
  args:
    cond_jitter_prob: 0.05
    predict_cam_token: true
    latent_token_length: 2048
    latent_model: latentseq_xl_step0400000
    min_aesthetic_score: 4.5
    image_size: 1024 # load with full res, rescaled in trainer mixin
    decoder_path: null  # path to stage3 VAE checkpoint directory
    decoder_ckpt: step0400000
    max_voxel_level: 8
    max_sampled_points: 8192
    decode_mode: gs
    ot_mode: 3d_ot
trainer:
  name: ImageConditionedLatentSeqFlowMatchingCFGTrainer
  args:
    image_cond_model: dinov3_flux2_concat_512
    finetune_ckpt:
      denoiser: /path/to/model  # path to pretrained denoiser checkpoint from configs/generation/latent1k-latentseq_flow_img_s3dit-L.yaml
    max_steps: 50000
    batch_size_per_gpu: 8
    batch_split: 1
    snapshot_num_samples: 8
    snapshot_dataset_num_samples: 8
    optimizer:
      name: AdamW
      args:
        lr: 5e-5
        weight_decay: 0.0
    lr_scheduler:
      name: LambdaLR
      args:
        lr_lambda:
          name: combined_warmup_cosine
          args:
            warmup_steps: 200          # Linear warmup steps
            min_lr_ratio: 0.1           # min_lr = base_lr * min_lr_ratio
    ema_rate: [0.9999]
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    i_log: 100
    i_train_val: 10000
    i_sample: 5000
    i_save: 20000
    p_uncond: 0.1
    t_schedule: 
      name: logitNormal
      args:
        mean: 0.3 # NOTE: shift this
        std: 1.0
    sigma_min: 0.00001
    use_wandb: true
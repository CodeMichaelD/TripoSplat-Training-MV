models:
  encoder:
    name: ElasticFixedlenEncoder
    args:
      pcd_pe_mode: pcd_ape_v2
      query_mode: fps
      model_channels: 1024
      cond_channels: 1280
      # cond_channels2: 16 # add in later stage
      q_token_length: 1024 # scale to 4096
      latent_channels: 16
      num_blocks: 16
      num_heads: 16
      mlp_ratio: 4
      use_fp16: true
      # use_2_cross_block: true # add in later stage
  decoder: 
    name: OctreeProbabilityFixedlenDecoder
    args: 
      pcd_pe_mode: pcd_ape_v2
      model_channels: 1024
      cond_channels: 16
      num_blocks: 4
      num_heads: 16
      mlp_ratio: 4
      share_mod: true
      use_fp16: true
dataset: 
  name: PcdFeat2Render
  args: 
    image_size: 512
    target_image_num: 8
    cond_image_num: null
    min_aesthetic_score: 4.5
    max_num_points: 8192
    max_num_points_cond: 16384
    model: dinov3_vith16plus
    output_mode: pcd_cond
    read_depth: false
train_val_dataset:
  name: PcdFeat2Render
  args: 
    image_size: 512
    target_image_num: 8
    cond_image_num: null
    min_aesthetic_score: 4.5
    max_num_points: 8192
    max_num_points_cond: 16384
    model: dinov3_vith16plus
    output_mode: pcd_cond
    read_depth: false
trainer: 
  name: OctreeFixlenVaeTrainer
  args: 
    latent_token_varlen_max_log_scale: null
    sample_algo: systematic
    max_voxel_level: 8
    max_sampled_points: 8192
    encode_dino: false
    max_steps: 100000
    batch_size_per_gpu: 4
    batch_split: 1
    snapshot_num_samples: 8
    snapshot_dataset_num_samples: 8
    optimizer:
      name: AdamW
      args: 
        lr: 1e-4
        weight_decay: 0.00
    lr_scheduler:
      name: LambdaLR
      args:
        lr_lambda:
          name: combined_warmup_cosine
          args:
            warmup_steps: 200          # Linear warmup steps
            min_lr_ratio: 0.01           # min_lr = base_lr * min_lr_ratio
    ema_rate: [
      0.9999
    ]
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    elastic: 
      name: LinearMemoryController
      args: 
        target_ratio: 0.5
        max_mem_ratio_start: 0.5
    grad_clip: 
      name: AdaptiveGradClipper
      args: 
        max_norm: 1.0
        clip_percentile: 95
    i_log: 100
    i_sample: 5000
    i_save: 20000
    i_train_val: 5000
    use_render_loss: false
    use_geo_loss: false
    lambda_entropy: 1.0
    lambda_kl: 0.01
    use_wandb: true

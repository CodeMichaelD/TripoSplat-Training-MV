models:
  encoder:
    name: ElasticFixedlenEncoder
    args:
      pcd_pe_mode: pcd_ape_v2
      query_mode: fps
      model_channels: 1024
      cond_channels: 1280
      cond_channels2: 32
      q_token_length: 8192 # NOTE
      latent_channels: 16
      num_blocks: 16
      num_heads: 16
      mlp_ratio: 4
      use_fp16: true
      use_2_cross_block: true
  decoder: 
    name: OctreeProbabilityFixedlenDecoder
    args: 
      pcd_pe_mode: pcd_ape_v2
      model_channels: 1024
      cond_channels: 16
      num_blocks: 4
      num_heads: 16
      mlp_ratio: 4
      share_mod: true
      use_fp16: true
  decoder_gs: 
    name: ElasticGaussianFixedlenDecoder
    args: 
      pcd_pe_mode: pcd_ape_v2
      in_channels: 3
      model_channels: 1024
      cond_channels: 16
      num_blocks: 16
      num_heads: 16
      mlp_ratio: 4
      use_fp16: true
      use_learned_offset_scale: true
      use_per_offset: true
      representation_config: 
        lr: 
          _xyz: 1.0
          _features_dc: 1.0
          _opacity: 1.0
          _scaling: 1.0
          _rotation: 0.1
        perturb_offset: true
        perturbe_size: 1.5
        offset_scale: 0.05
        num_gaussians: 32
        2d_filter_kernel_size: 0.1
        3d_filter_kernel_size: 9e-4
        scaling_bias: 4e-3
        opacity_bias: 0.1
        scaling_activation: softplus
dataset: 
  name: PcdFeat2Render
  args: 
    image_size: 512
    target_image_num: 16
    cond_image_num: null
    min_aesthetic_score: 4.5
    max_num_points: 8192
    max_num_points_cond: 16384
    model: dinov3_vith16plus
    max_num_points_cond2: 16384
    model2: flux2_dev_vae
    output_mode: pcd_cond
    read_depth: false
train_val_dataset:
  name: PcdFeat2Render
  args: 
    image_size: 512
    target_image_num: 16
    cond_image_num: null
    min_aesthetic_score: 4.5
    max_num_points: 8192
    max_num_points_cond: 16384
    model: dinov3_vith16plus
    max_num_points_cond2: 16384
    model2: flux2_dev_vae
    output_mode: pcd_cond
    read_depth: false
trainer: 
  name: GaussianOctreeFixlenVaeTrainer
  args: 
    l1c_clamp_percentile: 0.1
    latent_token_varlen_max_log_scale: 3
    sample_algo: systematic
    geo_warmup_steps: -1
    max_voxel_level: 8
    max_sampled_points: 8192 # NOTE
    varlen_max_log_scale: 3
    varlen_log_scale_uniform: false
    dual_encoder: false
    dual_decoder: true
    finetune_ckpt:
      decoder: null  # path to stage2 decoder checkpoint
      decoder_gs: null  # path to stage2 decoder_gs checkpoint
      encoder: null  # path to stage2 encoder checkpoint
    encode_dino: false
    max_steps: 400000
    batch_size_per_gpu: 1
    batch_split: 1
    snapshot_num_samples: 8
    snapshot_dataset_num_samples: 8
    optimizer:
      name: AdamW
      args: 
        lr: 2e-5
        weight_decay: 0.00
    lr_scheduler:
      name: LambdaLR
      args:
        lr_lambda:
          name: combined_warmup_cosine
          args:
            warmup_steps: 200          # Linear warmup steps
            min_lr_ratio: 0.01           # min_lr = base_lr * min_lr_ratio
    ema_rate: [
      0.9999
    ]
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    elastic: 
      name: LinearMemoryController
      args: 
        target_ratio: 0.5
        max_mem_ratio_start: 0.2
    grad_clip: 
      name: AdaptiveGradClipper
      args: 
        max_norm: 1.0
        clip_percentile: 95
    i_log: 100
    i_sample: 5000
    i_save: 10000
    i_train_val: 5000
    loss_type: l1
    use_render_loss: true
    use_geo_loss: false
    use_render_grad: true
    render_logits_clamp0: true
    lambda_entropy: 0.001
    lambda_render_logits: 1.0
    lambda_kl: 0.0001
    lambda_alpha: 0.0
    lambda_depth: 0.0
    lambda_ssim: 0.2
    lambda_lpips: 0.2
    lambda_offset_sphere_reg: 100.0
    offset_reg_dist_factor: 0.5
    regularizations:
      lambda_vol: 1.0
      lambda_opacity: 0.001
    use_wandb: true
